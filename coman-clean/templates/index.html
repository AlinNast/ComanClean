<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>
    <style>
        /* --- Internal CSS for Basic Styling --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: #f4f7f9;
        }
        .header {
            background-color: #00534E; /* Primary Blue */
            color: white;
            padding: 20px;
            text-align: center;
        }
        .search-container {
            max-width: 600px;
            margin: 40px auto; /* Centers the container and adds vertical spacing */
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: flex; /* Enables flexible layout for the search bar elements */
            gap: 10px; /* Space between the search bar and button */
        }
        .search-input {
            flex-grow: 1; /* Allows the input to take up most of the space */
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        .search-button {
            padding: 10px 20px;
            background-color: #28a745; /* Green for action */
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }
        .search-button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>Welcome to Paradise Resorts</h1>
    </header>

    <div class="search-container">
        <input type="text" class="search-input" name="destination" placeholder="Where would you like to go? (e.g., Maui, Bali, or Resort Name)">
        
        <button class="search-button">
            Search & Book
        </button>
    </div>

    <p style="text-align: center; margin-top: 20px; color: #6c757d;">
        More content will go here: featured resorts, user testimonials, etc.
    </p>

</body>
</html>
